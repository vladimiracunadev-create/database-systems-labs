name: database-systems-labs

services:
  postgres:
    image: postgres:18-alpine
    profiles: ["relational"]
    environment:
      POSTGRES_DB: learning
      POSTGRES_USER: learner
      POSTGRES_PASSWORD: local_postgres_only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learner -d learning"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mysql:
    image: mysql:8.4
    profiles: ["relational"]
    environment:
      MYSQL_DATABASE: learning
      MYSQL_USER: learner
      MYSQL_PASSWORD: local_mysql_only
      MYSQL_ROOT_PASSWORD: local_root_only
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - mysql_data:/var/lib/mysql

  mongodb:
    image: mongo:8.0
    profiles: ["document"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: learner
      MONGO_INITDB_ROOT_PASSWORD: local_mongo_only
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:8-alpine
    profiles: ["cache"]
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "local_redis_only"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  mysql_data:
  mongo_data:
  redis_data:
