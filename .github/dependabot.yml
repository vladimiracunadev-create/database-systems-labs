version: 2

# Las dependencias de este repositorio son pocas y todas de construccion: los
# laboratorios del nucleo no usan ninguna. Aun asi conviene enterarse cuando una
# accion de GitHub o una libreria del generador publica una version nueva, en
# vez de descubrirlo el dia que algo deja de funcionar.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
