name: Enlaces

# Comprueba semanalmente que sigue siendo alcanzable todo lo que el repositorio
# cita: las fuentes bibliograficas del registro Y la pagina de documentacion
# oficial que respalda cada afirmacion sobre cada motor.
#
# Va aparte de CI a proposito: un enlace que cae en un servidor ajeno no es un
# error del cambio que se acaba de subir, y no debe tenir de rojo un `push` que
# no tiene nada que ver.

on:
  schedule:
    - cron: "17 6 * * 1" # lunes por la mañana (UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuentes:
    name: Alcance de lo que se cita
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python -m pip install --quiet -r requirements.txt

      - name: Comprobar los dos registros
        id: check
        run: |
          set -o pipefail
          python scripts/check_external_links.py --timeout 30 | tee enlaces.log

      - name: Resumen
        if: always()
        run: |
          {
            echo "### 🔗 Estado de las fuentes y de la documentación de motores"
            echo ""
            echo '```text'
            tail -n 5 enlaces.log || echo "sin salida"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Informe completo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informe-enlaces
          path: enlaces.log
          retention-days: 30
