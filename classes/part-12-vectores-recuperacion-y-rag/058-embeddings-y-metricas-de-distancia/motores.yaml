---
caso:
  titulo: Qué documento se parece más al vector de la consulta, y en qué se mide
  contrato: |
    Un *embedding* convierte un texto en una lista de números de forma que los
    textos con significado parecido queden cerca. «Cerca» deja de ser una
    metáfora: es una distancia entre puntos, y hay que elegir cuál.

    El caso usa tres documentos de dimensión 3 con coordenadas enteras y busca
    el más parecido al vector `[2, 0, 0]`, con la **distancia euclídea al
    cuadrado** —que ordena igual que la euclídea, se calcula sin raíz y, si los
    vectores están normalizados, ordena igual que el coseno. Por eso casi todos
    los sistemas normalizan al indexar y luego hablan de coseno.

    El resultado es el ranking completo: A a distancia 0, C a 2 y B a 8. Lo que
    la matriz añade es qué ofrece cada motor cuando en vez de tres documentos
    hay diez millones.
  columnas: [id, distancia]
  esperado:
    - [A, "0"]
    - [C, "2"]
    - [B, "8"]

motores:
  - id: sqlite
    aplica: si
    ejecucion: nucleo
    archivo: implementaciones/sqlite/consulta.sql
    porque_si: >-
      Deja la operación a la vista: la distancia es aritmética sobre columnas, y
      escribirla a mano una vez vale más que cualquier explicación de qué hace
      un índice vectorial por dentro.
    porque_no: >-
      Esto es una **búsqueda exacta por fuerza bruta**: calcula la distancia a
      todos los documentos, siempre. Con tres es instantáneo; con diez millones
      de vectores de 768 dimensiones, es inviable, y ningún índice B-Tree ayuda
      porque el orden es por una función de todas las coordenadas.
    doc: https://sqlite.org/lang_expr.html

  - id: duckdb
    aplica: si
    ejecucion: nucleo
    archivo: implementaciones/duckdb/consulta.sql
    porque_si: >-
      Tiene tipo `ARRAY` de tamaño fijo y funciones de distancia nativas
      —`array_distance`, `array_cosine_similarity`—, así que la fuerza bruta
      vectorizada sobre millones de vectores es viable en un portátil. Para
      **evaluar** la calidad de una recuperación es justo lo que hace falta.
    porque_no: >-
      Su índice HNSW está en una extensión y es experimental; y sigue sin ser un
      servicio: no atiende consultas de una aplicación en producción.
    doc: https://duckdb.org/docs/stable/sql/functions/array

  - id: postgresql
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/postgresql/consulta.sql
    porque_si: >-
      Con la extensión **pgvector** aparece el tipo `vector`, los operadores de
      distancia (`<->`, `<=>`, `<#>`) e índices HNSW e IVFFlat, todo dentro del
      motor donde ya están los datos: se pueden filtrar por metadatos y buscar
      por vector **en la misma consulta y en la misma transacción**.
    porque_no: >-
      Es una extensión que hay que instalar y que no está en toda imagen —esta
      implementación usa aritmética a mano precisamente por eso—, y su
      rendimiento con muchos millones de vectores exige ajustar
      `hnsw.ef_search`, memoria de mantenimiento y tiempos de construcción del
      índice que se cuentan en horas.
    doc: https://www.postgresql.org/docs/current/functions-math.html

  - id: qdrant
    aplica: si
    ejecucion: declarado
    archivo: implementaciones/qdrant/consulta.json
    porque_si: >-
      Está construido solo para esto: HNSW con cuantización opcional, filtrado
      por carga útil **integrado en el recorrido del grafo** —no aplicado
      después— y una API pensada para búsqueda vectorial y nada más.
    porque_no: >-
      Es un sistema aparte: los vectores y los datos de negocio viven separados,
      así que hay que mantenerlos sincronizados y no hay transacción que abarque
      a los dos. Un documento borrado en la base puede seguir apareciendo en los
      resultados.
    doc: https://qdrant.tech/documentation/concepts/search/

  - id: milvus
    aplica: si
    ejecucion: declarado
    archivo: implementaciones/milvus/consulta.txt
    porque_si: >-
      Está pensado para escala distribuida desde el diseño: separa
      almacenamiento y cómputo, admite muchos tipos de índice (IVF, HNSW, DiskANN)
      y permite elegir el compromiso entre memoria, disco y exactitud.
    porque_no: >-
      Esa flexibilidad es también su costo: son varios componentes que operar
      —almacenamiento de objetos, registro de mensajes, coordinadores— y para
      unos pocos millones de vectores es infraestructura de sobra.
    doc: https://milvus.io/docs/metric.md

  - id: mongodb
    aplica: no
    porque_no: >-
      La búsqueda vectorial existe, pero solo en Atlas —el servicio
      administrado—, no en la edición Community que se puede levantar aquí.
      Presentarla como una capacidad del motor sería inexacto.
    alternativa: >-
      Guardar el vector como arreglo y calcular la distancia en la tubería de
      agregación para conjuntos pequeños, o usar Atlas Vector Search, que por
      debajo es Lucene con HNSW.
    doc: https://www.mongodb.com/docs/atlas/atlas-vector-search/vector-search-overview/

  - id: redis
    aplica: no
    porque_no: >-
      La búsqueda vectorial de Redis vive en su módulo de búsqueda, no en el
      servidor base que se levanta en este repositorio: sin el módulo, un vector
      es una cadena opaca.
    alternativa: >-
      Con el módulo, un índice vectorial sobre campos de hash o JSON, con HNSW o
      fuerza bruta; sin él, Redis como caché de resultados de búsqueda ya
      calculados.
    doc: https://redis.io/docs/latest/develop/interact/search-and-query/query/vector-search/
