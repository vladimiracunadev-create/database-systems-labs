---
# El mismo problema, resuelto en cada motor. La matriz completa —incluidos los
# motores donde la reunión NO se hace— se publica en el README de la clase.

caso:
  titulo: Cada estudiante con el curso en que está inscrito, sin perder a los que no tienen ninguno
  contrato: |
    Con tres estudiantes (Ada, Linus, Grace), dos cursos (DB-101, SE-201) y tres
    inscripciones (Ada en ambos, Linus en DB-101, Grace en ninguno), devolver una
    fila por pareja estudiante-curso, ordenada por nombre y luego por código.
    Los estudiantes sin ninguna inscripción aparecen con el literal `sin-curso`:
    un centinela explícito en vez de un nulo, porque cada cliente de línea de
    órdenes imprime el nulo de una forma distinta y lo que aquí se compara entre
    motores es el resultado, no el formato.
  columnas: [nombre, codigo]
  esperado:
    - [Ada, DB-101]
    - [Ada, SE-201]
    - [Grace, sin-curso]
    - [Linus, DB-101]

motores:
  - id: sqlite
    aplica: si
    ejecucion: nucleo
    archivo: implementaciones/sqlite/consulta.sql
    porque_si: >-
      Es el motor relacional que ya está instalado: viene con Python, no pide
      servidor y ejecuta el `LEFT JOIN` estándar. Para aprender la operación sin
      que la infraestructura estorbe, no hay nada más corto.
    porque_no: >-
      El planificador es deliberadamente simple: hasta la versión 3.39 no tenía
      `RIGHT JOIN` ni `FULL JOIN`, y solo dispone de bucle anidado —no hay
      reunión hash ni por fusión—, así que las lecciones de rendimiento de una
      reunión grande no se transfieren desde aquí.
    doc: https://sqlite.org/lang_select.html

  - id: duckdb
    aplica: si
    ejecucion: nucleo
    archivo: implementaciones/duckdb/consulta.sql
    porque_si: >-
      Misma sintaxis estándar, pero ejecutada por un motor columnar vectorizado:
      la misma reunión sobre millones de filas termina en un portátil. Es el
      motor donde comprobar que el resultado no cambia y el tiempo sí.
    porque_no: >-
      Está pensado para analítica de un proceso a la vez: no hay control de
      concurrencia entre escritores ni servicio al que se conecten cien
      aplicaciones, así que no sustituye al motor transaccional del que salen
      los datos.
    doc: https://duckdb.org/docs/current/sql/query_syntax/from.html

  - id: postgresql
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/postgresql/consulta.sql
    porque_si: >-
      Es la referencia práctica del SQL de reuniones: tiene los tres algoritmos
      físicos (bucle anidado, hash y fusión), `FULL OUTER JOIN`, `LATERAL` y un
      `EXPLAIN (ANALYZE, BUFFERS)` que dice cuál eligió y por qué. Lo que se
      aprende aquí se lee después en cualquier motor.
    porque_no: >-
      Cada conexión es un proceso del sistema operativo: sin un agrupador
      delante (PgBouncer), unas pocas centenas de conexiones ociosas cuestan más
      memoria que la propia consulta. La reunión no es el problema; el modelo de
      conexiones sí.
    doc: https://www.postgresql.org/docs/current/queries-table-expressions.html

  - id: mysql
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/mysql/consulta.sql
    porque_si: >-
      Es el motor relacional más desplegado en aplicaciones web y resuelve la
      misma consulta con el mismo estándar; desde 8.0.18 tiene reunión hash, de
      modo que el `LEFT JOIN` sin índice ya no degrada a bucle anidado.
    porque_no: >-
      No tiene `FULL OUTER JOIN` —hay que emularlo con `UNION`— y su optimizador
      históricamente materializa subconsultas que PostgreSQL aplana, así que las
      consultas con reuniones anidadas hay que medirlas, no suponerlas.
    doc: https://dev.mysql.com/doc/refman/8.4/en/join.html

  - id: sql-server
    aplica: si
    ejecucion: declarado
    archivo: implementaciones/sql-server/consulta.sql
    porque_si: >-
      El optimizador basado en costos y las sugerencias explícitas de reunión
      (`OPTION (HASH JOIN)`) lo hacen el mejor sitio para ver el efecto de cada
      algoritmo físico, y el plan gráfico de SSMS enseña la reunión mejor que
      cualquier diagrama.
    porque_no: >-
      Licencia por núcleo y una edición gratuita (Express) limitada a 10 GB por
      base y a un socket: la decisión de usarlo casi nunca la toma la consulta,
      la toma el contrato.
    doc: https://learn.microsoft.com/sql/t-sql/queries/from-transact-sql

  - id: oracle-database
    aplica: si
    ejecucion: declarado
    archivo: implementaciones/oracle-database/consulta.sql
    porque_si: >-
      Es donde viven los sistemas transaccionales grandes y antiguos, y su
      optimizador tiene el catálogo de transformaciones más amplio (`STAR
      TRANSFORMATION`, reescritura de vistas materializadas) sobre reuniones de
      muchas tablas.
    porque_no: >-
      Sintaxis heredada `(+)` conviviendo con la estándar, cadena vacía tratada
      como nulo —lo que rompe el centinela `COALESCE` de otros motores— y un
      costo de licencia que solo un sistema muy grande justifica.
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/23/sqlrf/SELECT.html

  - id: mongodb
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/mongodb/consulta.js
    porque_si: >-
      Desde la versión 3.2 `$lookup` hace la reunión izquierda dentro del motor,
      así que un modelo documental normalizado no obliga a reunir en la
      aplicación. Con `preserveNullAndEmptyArrays` el `$unwind` conserva a
      quien no tiene pareja: es literalmente un `LEFT JOIN`.
    porque_no: >-
      `$lookup` no usa índices del lado interno con la misma libertad que un
      motor relacional y no hay reunión hash ni por fusión entre colecciones:
      cuando el patrón de acceso pide reunir todo el rato, el modelo está mal y
      lo que tocaba era incrustar el curso en el documento del estudiante.
    doc: https://www.mongodb.com/docs/manual/reference/operator/aggregation/lookup/

  - id: neo4j
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/neo4j/consulta.cypher
    porque_si: >-
      La reunión externa se llama `OPTIONAL MATCH` y no hay tabla intermedia que
      declarar: la inscripción es una arista. Cuando el recorrido tiene varios
      saltos —estudiante, curso, prerrequisito, profesor— el costo no crece con
      el tamaño del grafo, sino con el del vecindario recorrido.
    porque_no: >-
      Ese mismo modelo penaliza lo tabular: contar y agregar sobre todos los
      nodos de una etiqueta es más caro que en una tabla, y mantener un grafo
      solo para reunir dos entidades que ya son tablas añade un sistema entero
      sin resolver nada.
    doc: https://neo4j.com/docs/cypher-manual/current/clauses/optional-match/

  - id: cassandra
    aplica: si
    ejecucion: declarado
    archivo: implementaciones/cassandra/consulta.cql
    porque_si: >-
      CQL no tiene `JOIN`, y aun así el caso se resuelve: se paga la reunión en
      la escritura y se guarda ya resuelta la tabla que la consulta necesita. Es
      la lección de modelado más importante de las columnas anchas —se modela
      desde la consulta, no desde las entidades— y da lecturas de una sola
      partición a latencia predecible.
    porque_no: >-
      Cada consulta nueva es una tabla nueva que hay que llenar y mantener
      coherente sin transacciones entre tablas; y el orden total del resultado
      no está garantizado al recorrer varias particiones, porque el orden entre
      particiones lo fija el token, no el `ORDER BY`.
    doc: https://cassandra.apache.org/doc/latest/cassandra/developing/cql/dml.html

  - id: redis
    aplica: no
    porque_no: >-
      Redis no tiene reuniones ni un lenguaje de consulta sobre relaciones: es
      un servidor de estructuras de datos donde el acceso es por clave. Reunir
      exigiría traer las claves de los estudiantes, luego las de sus
      inscripciones y luego las de los cursos —tres viajes por estudiante— y
      hacer la reunión en la aplicación, que es exactamente lo que un motor
      relacional evita.
    alternativa: >-
      Guardar el resultado ya reunido como valor de una clave
      (`estudiante:1:cursos`) y recalcularlo cuando cambie el origen: Redis como
      caché de la reunión que hace otro motor, no como sustituto.
    doc: https://redis.io/docs/latest/develop/data-types/

  - id: dynamodb
    aplica: no
    porque_no: >-
      El modelo de DynamoDB parte de que no hay reuniones en tiempo de consulta:
      solo se puede acceder por clave de partición y ordenación. Una reunión de
      tres entidades se traduce en varias `Query` o en un `Scan`, y el `Scan`
      lee y cobra la tabla entera.
    alternativa: >-
      Diseño de tabla única: estudiante e inscripciones comparten clave de
      partición (`ESTUDIANTE#1`) y se distinguen por la de ordenación
      (`PERFIL`, `CURSO#DB-101`), de modo que una sola `Query` devuelve lo que
      aquí es una reunión.
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-modeling-nosql-B.html

  - id: opensearch
    aplica: no
    porque_no: >-
      Es un índice invertido para buscar y puntuar documentos, no para
      relacionar entidades. El campo `join` existe, pero obliga a que padre e
      hijo vivan en el mismo fragmento y penaliza cada consulta; la propia
      documentación recomienda desnormalizar antes que usarlo.
    alternativa: >-
      Indexar el documento ya desnormalizado (estudiante con la lista de sus
      cursos dentro) y reindexar cuando cambie, aceptando que el índice va por
      detrás del origen.
    doc: https://docs.opensearch.org/latest/field-types/supported-field-types/join/
