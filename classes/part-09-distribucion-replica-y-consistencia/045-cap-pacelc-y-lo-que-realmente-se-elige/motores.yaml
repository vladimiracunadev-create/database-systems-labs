---
caso:
  titulo: Qué se elige de verdad cuando se dice «elegimos AP» o «elegimos CP»
  modo: conceptual
  contrato: |
    El teorema CAP dice algo muy concreto y muy limitado: **cuando la red se
    parte**, un sistema no puede ser a la vez consistente —en el sentido de
    linealizable— y disponible. Nada más. No dice que haya que elegir dos de
    tres, ni describe el comportamiento normal del sistema, que es el 99,9 % del
    tiempo.

    Por eso Abadi propuso PACELC, que completa la frase: **si hay partición (P),
    se elige entre disponibilidad (A) y consistencia (C); y si no (E, *else*), se
    elige entre latencia (L) y consistencia (C)**. La segunda mitad es la que
    manda casi siempre, y es la que las etiquetas «AP» y «CP» esconden.

    Aquí se compara qué elige cada motor en las dos mitades, y —lo más útil—
    **qué se puede ajustar por operación** en vez de por sistema.
  columnas: []
  esperado: []

motores:
  - id: cassandra
    aplica: si
    como: >-
      PA/EL en la clasificación de Abadi: ante partición prefiere disponibilidad,
      y sin partición prefiere latencia. Pero eso es el valor por omisión, no una
      propiedad fija: el nivel de consistencia se elige **por consulta**, y con
      `QUORUM` en lectura y escritura se obtiene consistencia fuerte a cambio de
      esperar a la mayoría.
    porque_si: >-
      Poder decidir por operación es lo más honesto que ofrece esta lista: la
      escritura del pago con `QUORUM`, la del registro de actividad con `ONE`, en
      el mismo clúster y en la misma aplicación.
    porque_no: >-
      Esa decisión hay que tomarla en **cada** consulta, y equivocarse no da
      ningún error: da datos viejos. Y la fórmula «R + W > RF» hay que llevarla
      en la cabeza al escribir cada línea de código.
    doc: https://cassandra.apache.org/doc/latest/cassandra/developing/cql/dml.html

  - id: mongodb
    aplica: si
    como: >-
      PC/EC: ante partición, la minoría deja de aceptar escrituras —el primario
      se degrada— y sin partición prioriza consistencia con `readConcern` y
      `writeConcern`. También se ajusta por operación.
    porque_si: >-
      El valor por omisión es el seguro y el arriesgado hay que pedirlo, que es
      el orden correcto: `w: "majority"` y `readConcern: "majority"` dan
      lecturas coherentes sin cambiar de motor.
    porque_no: >-
      Leer de secundarios para repartir carga rompe esa garantía sin avisar, y
      es lo primero que se hace cuando el primario va justo: la optimización más
      tentadora es justo la que cambia el modelo de consistencia.
    doc: https://www.mongodb.com/docs/manual/reference/read-concern/

  - id: postgresql
    aplica: si
    como: >-
      Con un solo nodo, la pregunta no se plantea: es CA en el sentido trivial de
      que no hay partición posible. Con réplica, el líder es consistente y las
      réplicas van por detrás; `synchronous_commit = remote_apply` da lecturas
      coherentes en la réplica a cambio de latencia en cada confirmación.
    porque_si: >-
      Es el sistema más fácil de razonar: mientras se lea del primario, no hay
      modelo de consistencia que estudiar.
    porque_no: >-
      En cuanto se reparte la lectura entre réplicas, el sistema deja de ser
      trivial y nadie lo declara: la aplicación empieza a leer datos viejos sin
      que nada en el código lo indique. Es el «lo dirigimos a la réplica» que
      rompe el registro después de crearlo.
    doc: https://www.postgresql.org/docs/current/warm-standby.html

  - id: spanner
    aplica: si
    como: >-
      CP con disponibilidad muy alta en la práctica: consistencia externa
      —equivalente a linealizabilidad— mediante Paxos y **relojes con
      incertidumbre acotada** (TrueTime). En vez de fingir que los relojes están
      sincronizados, mide el error y espera a que la incertidumbre pase.
    porque_si: >-
      Ofrece transacciones distribuidas con serializabilidad estricta a escala
      global, algo que se consideraba imposible antes de 2012, y con SQL
      estándar encima.
    porque_no: >-
      Ese «esperar a que la incertidumbre pase» es latencia real en cada
      confirmación, y depende de una infraestructura de relojes —GPS y relojes
      atómicos— que solo existe dentro de un proveedor. La disponibilidad es
      altísima; el teorema no se ha roto, se ha comprado.
    doc: https://cloud.google.com/spanner/docs/true-time-external-consistency

  - id: cockroachdb
    aplica: si
    como: >-
      CP también, con Raft por rango y serializabilidad como único nivel de
      aislamiento. Sin relojes atómicos: usa un intervalo de incertidumbre y
      reintenta las transacciones que caen dentro de él.
    porque_si: >-
      Da la misma garantía fuerte sobre infraestructura corriente y con
      protocolo de PostgreSQL, así que buena parte de las herramientas ya
      existentes funcionan.
    porque_no: >-
      Los reintentos por incertidumbre son visibles para la aplicación: hay que
      escribir el ciclo de reintento sí o sí. Y con réplicas repartidas entre
      regiones, cada escritura paga la latencia de llegar a la mayoría.
    doc: https://www.cockroachlabs.com/docs/stable/architecture/transaction-layer

  - id: redis
    aplica: si
    como: >-
      Ni AP ni CP en sentido estricto: la réplica es asíncrona y la conmutación
      puede perder escrituras confirmadas. Su propia documentación lo dice y no
      promete consistencia fuerte.
    porque_si: >-
      Para su trabajo —caché, colas, contadores, sesiones— esa elección es la
      correcta: la latencia es el requisito y perder el último segundo de una
      caché no cuesta nada.
    porque_no: >-
      El problema aparece cuando alguien empieza a guardar ahí lo que sí cuesta
      perder. Redis no engaña a nadie; la arquitectura que lo usa como fuente de
      verdad, sí.
    doc: https://redis.io/docs/latest/operate/oss_and_stack/management/replication/

  - id: sqlite
    aplica: no
    porque_no: >-
      Un solo proceso y un solo archivo: no hay red que se pueda partir, así que
      el teorema no dice nada sobre él. Incluirlo aquí sería usar el vocabulario
      sin el problema.
    alternativa: >-
      La pregunta análoga en un sistema de un solo nodo es otra —qué pasa si se
      corta la luz— y se estudia en la clase de registro anticipado y
      recuperación.
    doc: https://sqlite.org/whentouse.html
