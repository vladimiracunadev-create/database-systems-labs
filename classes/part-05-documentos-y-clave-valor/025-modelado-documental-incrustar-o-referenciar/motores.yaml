---
caso:
  titulo: Las líneas de un pedido, incrustadas o referenciadas
  contrato: |
    La decisión central del modelado documental cabe en una pregunta: ¿este dato
    vive **dentro** del documento o **al lado**? Y la respuesta no sale del
    dominio, sale del patrón de acceso: se incrusta lo que siempre se lee junto
    y cambia junto; se referencia lo que se comparte, lo que crece sin límite y
    lo que cambia por su cuenta.

    El caso pide las líneas del pedido `P-1` con su importe, ordenadas por
    producto. Los seis motores devuelven lo mismo; lo que cambia es dónde
    estaban guardadas, y el bloque de cada uno muestra la forma que le es
    natural. Compararlas es comparar el precio de cada decisión.
  columnas: [producto, importe]
  esperado:
    - [cable, "100"]
    - [raton, "80"]
    - [teclado, "120"]

motores:
  - id: mongodb
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/mongodb/consulta.js
    porque_si: >-
      Incrustar es una lectura: un documento, un viaje, sin reunión. Para datos
      que solo tienen sentido dentro de su padre —las líneas de un pedido— es la
      forma correcta y la que su propia guía de modelado recomienda.
    porque_no: >-
      Deja de serlo en cuanto el arreglo crece sin techo: el documento tiene un
      límite de 16 MB, y cada actualización reescribe el documento entero
      aunque solo cambie un elemento del arreglo.
    doc: https://www.mongodb.com/docs/manual/data-modeling/concepts/embedding-vs-references/

  - id: sqlite
    aplica: si
    ejecucion: nucleo
    archivo: implementaciones/sqlite/consulta.sql
    porque_si: >-
      Con las funciones JSON integradas se puede incrustar de verdad: el pedido
      es una fila y sus líneas un arreglo JSON dentro de una columna, que
      `json_each` desanida cuando hace falta.
    porque_no: >-
      Ese arreglo es texto para el motor: no hay restricciones sobre su
      contenido, ni claves foráneas, ni índice que lo recorra. Se gana la forma
      documental y se pierde todo lo que hacía valioso al relacional.
    doc: https://sqlite.org/json1.html

  - id: duckdb
    aplica: si
    ejecucion: nucleo
    archivo: implementaciones/duckdb/consulta.sql
    porque_si: >-
      Tiene tipos anidados de verdad —`STRUCT` y `LIST` con tipos declarados—,
      así que el documento incrustado sigue siendo columnar y `UNNEST` lo abre
      sin analizar texto.
    porque_no: >-
      Está pensado para leer datos anidados que vienen de otro sitio (Parquet,
      JSON), no para ser el sistema donde esos documentos se editan a diario.
    doc: https://duckdb.org/docs/stable/sql/data_types/struct.html

  - id: postgresql
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/postgresql/consulta.sql
    porque_si: >-
      `jsonb` no guarda texto: guarda una representación binaria indexable con
      GIN, así que se puede incrustar sin renunciar al índice ni a las
      transacciones ni a las claves foráneas del resto del esquema. Es la opción
      que permite decidir tabla por tabla.
    porque_no: >-
      Un `UPDATE` sobre un campo del `jsonb` reescribe la fila entera y genera
      una versión nueva: con documentos grandes y cambios frecuentes, el
      almacenamiento y el autovacío se resienten.
    doc: https://www.postgresql.org/docs/current/datatype-json.html

  - id: couchdb
    aplica: si
    ejecucion: declarado
    archivo: implementaciones/couchdb/consulta.json
    porque_si: >-
      Lleva la idea al extremo: el documento es la unidad de todo —de lectura,
      de escritura, de conflicto y de réplica—, así que incrustar no es una
      opción de diseño sino el modelo. Y su réplica multimaestro está construida
      sobre esa unidad.
    porque_no: >-
      No hay reuniones ni consultas ad hoc eficientes: todo lo que no sea leer
      por identificador exige definir una vista con `map`/`reduce` de antemano.
      Referenciar es posible y es incómodo a propósito.
    doc: https://docs.couchdb.org/en/stable/ddocs/views/intro.html

  - id: dynamodb
    aplica: no
    porque_no: >-
      Aquí la disyuntiva no se plantea igual: el límite duro de 400 KB por
      elemento hace que incrustar una lista sin techo sea inviable desde el
      primer día, y no hay consulta que sirva para descubrirlo tarde.
    alternativa: >-
      Diseño de tabla única: el pedido y sus líneas comparten clave de partición
      (`PEDIDO#P-1`) y se distinguen por la de ordenación (`META`,
      `LINEA#cable`), de modo que una sola `Query` devuelve el pedido entero sin
      incrustar nada.
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-adjacency-graphs.html
