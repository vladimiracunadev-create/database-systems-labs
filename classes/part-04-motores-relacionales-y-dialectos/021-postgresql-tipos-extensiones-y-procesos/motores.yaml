---
caso:
  titulo: Qué cursos llevan la etiqueta «datos», con las etiquetas dentro de la fila
  contrato: |
    Un curso tiene varias etiquetas. La solución relacional ortodoxa es una
    tabla `etiquetas_de_curso`, y sigue siendo la correcta muchas veces. Pero
    PostgreSQL permite algo que la norma no contempla: guardar el conjunto
    **dentro** de la fila, como un arreglo con su propio índice invertido.

    El caso pregunta qué cursos llevan la etiqueta `datos`, ordenados por
    código, con las etiquetas guardadas en la propia fila. Sirve para ver la
    misma idea —una colección dentro del registro— en seis motores que la
    resuelven de seis maneras distintas, y para tener a la vista lo que se paga
    por salirse del modelo plano.
  columnas: [curso]
  esperado:
    - [AR-301]
    - [DB-101]

motores:
  - id: postgresql
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/postgresql/consulta.sql
    porque_si: >-
      Es su terreno: tipo `text[]` nativo, operador de contención `@>` e índice
      GIN que lo resuelve sin recorrer la tabla. Y con `jsonb`, rangos, tipos
      enumerados y extensiones como PostGIS o pgvector, el mismo motor cubre
      casos que en otro exigirían un sistema aparte.
    porque_no: >-
      Nada de eso es portable: un `text[]` con GIN no existe en MySQL ni en SQL
      Server, y una migración obliga a rediseñar el modelo, no solo a traducir
      la consulta. Además el arreglo no admite integridad referencial: nada
      impide una etiqueta que no está en el catálogo.
    doc: https://www.postgresql.org/docs/current/arrays.html

  - id: sqlite
    aplica: si
    ejecucion: nucleo
    archivo: implementaciones/sqlite/consulta.sql
    porque_si: >-
      Con las funciones JSON integradas —que dejaron de ser una extensión en la
      versión 3.38— guarda la lista como texto JSON y la recorre con
      `json_each`, sin tabla adicional.
    porque_no: >-
      No hay índice que acelere esa búsqueda: `json_each` recorre la tabla
      entera. Funciona con cientos de filas y deja de funcionar con millones.
    doc: https://sqlite.org/json1.html

  - id: duckdb
    aplica: si
    ejecucion: nucleo
    archivo: implementaciones/duckdb/consulta.sql
    porque_si: >-
      Tiene un tipo `LIST` nativo y con tipo interno declarado, así que la
      columna sigue siendo columnar y comprimible; `list_contains` la consulta
      sin desanidar nada.
    porque_no: >-
      Tampoco hay índice invertido: la ventaja aquí no es el índice sino la
      lectura columnar, y eso solo compensa cuando se leen muchas filas de pocas
      columnas.
    doc: https://duckdb.org/docs/stable/sql/data_types/list.html

  - id: mysql
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/mysql/consulta.sql
    porque_si: >-
      El tipo `JSON` valida el documento al escribir y `JSON_CONTAINS` responde
      la pregunta sin tabla intermedia.
    porque_no: >-
      No se puede indexar un `JSON` directamente: hay que crear una columna
      generada por cada camino que se quiera indexar, o un índice multivaluado
      con `CAST(... AS CHAR(20) ARRAY)`, que es reciente y con reglas propias.
      La comodidad de escritura se paga en el diseño del índice.
    doc: https://dev.mysql.com/doc/refman/8.4/en/json.html

  - id: mongodb
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/mongodb/consulta.js
    porque_si: >-
      Aquí no hay nada que decidir: el arreglo es un tipo de primera clase y un
      índice sobre él es un índice multiclave que indexa cada elemento. Es el
      caso para el que el modelo documental existe.
    porque_no: >-
      Un índice multiclave crea una entrada por elemento del arreglo: con
      arreglos grandes, el índice crece más rápido que los datos, y no se pueden
      combinar dos campos de arreglo en un mismo índice compuesto.
    doc: https://www.mongodb.com/docs/manual/core/indexes/index-types/index-multikey/

  - id: redis
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/redis/consulta.txt
    porque_si: >-
      Invierte el problema: en vez de guardar las etiquetas del curso, guarda
      los cursos de cada etiqueta. Preguntar por una etiqueta es leer un
      conjunto —O(1) para llegar—, y cruzar dos etiquetas es `SINTER`.
    porque_no: >-
      La pregunta inversa —«¿qué etiquetas tiene este curso?»— exige mantener
      también la otra dirección, y ninguna de las dos estructuras sabe de la
      existencia de la otra: la coherencia entre ambas la sostiene el código.
    doc: https://redis.io/docs/latest/commands/sinter/

  - id: cassandra
    aplica: si
    ejecucion: declarado
    archivo: implementaciones/cassandra/consulta.cql
    porque_si: >-
      Tiene colecciones (`set<text>`) dentro de la fila y permite indexarlas con
      un índice secundario sobre los valores de la colección.
    porque_no: >-
      Un índice secundario en Cassandra consulta a **todos** los nodos, porque
      el índice es local a cada uno: es aceptable con pocos valores distintos y
      catastrófico con muchos. La forma idiomática sigue siendo una tabla
      `cursos_por_etiqueta` escrita a mano.
    doc: https://cassandra.apache.org/doc/latest/cassandra/developing/cql/types.html

  - id: sql-server
    aplica: no
    porque_no: >-
      No tiene tipo arreglo ni tipo JSON: el JSON se guarda como `nvarchar` y se
      consulta con `OPENJSON`, sin índice invertido. La colección dentro de la
      fila no es un ciudadano del modelo, es texto con funciones alrededor.
    alternativa: >-
      La tabla de unión de toda la vida, `curso_etiqueta`, con su índice: menos
      vistosa y, en este motor, casi siempre más rápida.
    doc: https://learn.microsoft.com/sql/relational-databases/json/json-data-sql-server
