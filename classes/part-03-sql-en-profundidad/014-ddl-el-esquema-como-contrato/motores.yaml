---
caso:
  titulo: Un esquema que rechaza por su cuenta los datos que no cumplen el contrato
  contrato: |
    El DDL no describe los datos: los **restringe**. Un esquema es un contrato
    ejecutable, y la forma de comprobar que existe es intentar romperlo.

    El caso intenta guardar cuatro notas. Dos son válidas. Una trae nota 130
    —fuera del rango declarado— y otra trae el nombre del estudiante vacío. El
    programa no comprueba nada; las dos inválidas tienen que rebotar contra el
    esquema. La consulta devuelve lo que quedó guardado, ordenado por
    estudiante: exactamente las dos válidas.
  columnas: [estudiante, nota]
  esperado:
    - [Ada, "90"]
    - [Linus, "58"]

motores:
  - id: sqlite
    aplica: si
    ejecucion: nucleo
    archivo: implementaciones/sqlite/consulta.sql
    porque_si: >-
      Tiene `CHECK`, `NOT NULL`, `UNIQUE` y claves foráneas, y `INSERT OR IGNORE`
      permite ver el rechazo sin abortar el guion: el contrato actúa a la vista.
    porque_no: >-
      Su tipado es dinámico por afinidad: en una columna `INTEGER` cabe la
      cadena `'alto'` si el motor no la puede convertir. Desde 3.37 existen las
      tablas `STRICT`, pero no son las de por omisión, así que casi ninguna base
      SQLite existente comprueba tipos.
    doc: https://sqlite.org/stricttables.html

  - id: duckdb
    aplica: si
    ejecucion: nucleo
    archivo: implementaciones/duckdb/consulta.sql
    porque_si: >-
      El tipado sí es estricto: una nota `'alto'` en una columna entera falla al
      insertar, sin conversiones silenciosas. Es el motor donde el contrato de
      tipos se cumple sin pedirlo.
    porque_no: >-
      No tiene `INSERT OR IGNORE` para violaciones de `CHECK`: la fila inválida
      aborta la sentencia entera. Para cargar datos sucios hay que filtrarlos
      antes, que es justo lo que un almacén analítico espera que hayas hecho ya.
    doc: https://duckdb.org/docs/stable/sql/constraints.html

  - id: postgresql
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/postgresql/consulta.sql
    porque_si: >-
      Es el que más lejos lleva la idea de contrato: además de `CHECK` tiene
      dominios (`CREATE DOMAIN`) para dar nombre a una restricción y reutilizarla,
      tipos enumerados y restricciones de exclusión. La regla se declara una vez
      y vale para toda tabla que use el tipo.
    porque_no: >-
      Añadir un `CHECK` a una tabla grande la bloquea mientras valida las filas
      existentes, salvo que se declare `NOT VALID` y se valide después: el
      contrato se endurece con una ventana de mantenimiento, no con un despliegue.
    doc: https://www.postgresql.org/docs/current/ddl-constraints.html

  - id: mysql
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/mysql/consulta.sql
    porque_si: >-
      Desde 8.0.16 los `CHECK` se comprueban de verdad, y `INSERT IGNORE`
      convierte el rechazo en aviso, lo que permite cargar por lotes sin perder
      el lote entero.
    porque_no: >-
      Antes de 8.0.16 el `CHECK` se analizaba y se **ignoraba en silencio**: hay
      esquemas heredados llenos de restricciones que nunca comprobaron nada. Y
      sin el modo estricto, un `INSERT` con un valor imposible se convertía en un
      aviso y guardaba un cero.
    doc: https://dev.mysql.com/doc/refman/8.4/en/create-table-check-constraints.html

  - id: mongodb
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/mongodb/consulta.js
    porque_si: >-
      `$jsonSchema` con `validationAction: "error"` da un contrato equivalente
      —tipos, rangos, campos obligatorios— sin renunciar a que el documento
      evolucione: se puede empezar sin esquema y endurecerlo cuando el dominio
      se entiende.
    porque_no: >-
      Es opcional y se aplica solo a las escrituras posteriores: con
      `validationLevel: "moderate"` los documentos que ya estaban mal siguen
      estando mal, y nada en el documento delata que hay un contrato detrás.
    doc: https://www.mongodb.com/docs/manual/core/schema-validation/

  - id: cassandra
    aplica: no
    porque_no: >-
      CQL declara tipos, pero no tiene `CHECK` ni restricciones de dominio: no
      hay forma de decir «la nota está entre 0 y 100». Cualquier comprobación de
      ese tipo exigiría leer o validar en el servidor, y su modelo de escritura
      no lee nada.
    alternativa: >-
      Validar en la capa de servicio que está delante del clúster, y aceptar que
      el contrato vive en el código, no en el almacén: si alguien escribe con
      `cqlsh`, no hay red de seguridad.
    doc: https://cassandra.apache.org/doc/latest/cassandra/developing/cql/types.html

  - id: redis
    aplica: no
    porque_no: >-
      No hay esquema en absoluto: toda clave admite cualquier valor. La única
      «restricción» es el tipo de la estructura —no se puede hacer `INCR` sobre
      una lista—, y eso no es un contrato de dominio.
    alternativa: >-
      Validar antes de escribir en el cliente, o usar RedisJSON con un esquema
      comprobado en la aplicación; en cualquier caso, la regla la sostiene el
      código.
    doc: https://redis.io/docs/latest/develop/data-types/

  - id: opensearch
    aplica: no
    porque_no: >-
      Un `mapping` fija tipos, pero su comportamiento por omisión es el
      contrario al de un contrato: el mapeo dinámico **crea** el campo que
      aparezca. Y un campo mal tipado no se puede cambiar sin reindexar.
    alternativa: >-
      `dynamic: strict` en el mapeo, que rechaza los documentos con campos no
      declarados; sigue sin haber rangos ni condiciones sobre los valores.
    doc: https://docs.opensearch.org/latest/field-types/
