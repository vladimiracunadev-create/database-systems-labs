---
caso:
  titulo: Dos clientes que leyeron lo mismo y solo uno puede escribir
  contrato: |
    La transacción protege lo que ocurre **dentro** de ella. No protege del caso
    más común de todos: leer un dato, enseñárselo a una persona, y escribirlo
    minutos después cuando ya no es el mismo. Entre la lectura y la escritura no
    hay transacción posible, y ahí es donde se pierden las actualizaciones.

    El caso lo reproduce sin concurrencia real: dos clientes leen la cuenta en la
    versión 1, y los dos intentan escribir. El primero gana; el segundo lleva la
    condición `version = 1` en su `UPDATE`, no afecta a ninguna fila y **se
    entera**. Si saliera saldo 20, los dos habrían escrito; si saliera 50, se
    habría perdido el descuento del primero. Que salga 70 con versión 2 es la
    prueba de que exactamente uno ganó y el otro lo supo.
  columnas: [cuenta, saldo, version]
  esperado:
    - [cuenta-1, "70", "2"]

motores:
  - id: sqlite
    aplica: si
    ejecucion: nucleo
    archivo: implementaciones/sqlite/consulta.sql
    porque_si: >-
      El bloqueo optimista no necesita nada del motor: es una columna y una
      condición en el `WHERE`. Funciona igual aquí que en el motor más caro del
      mercado, y esa es justamente la lección.
    porque_no: >-
      Hay que comprobar cuántas filas se modificaron —`changes()`— y actuar en
      consecuencia. Un `UPDATE` que no afecta a nada **no es un error**: si nadie
      mira, el conflicto pasa desapercibido, que es peor que perder la
      actualización.
    doc: https://sqlite.org/lang_update.html

  - id: duckdb
    aplica: si
    ejecucion: nucleo
    archivo: implementaciones/duckdb/consulta.sql
    porque_si: >-
      Misma técnica y misma sintaxis: sirve para comprobar sobre un volcado
      cuántas versiones tiene cada registro y si el patrón se está aplicando de
      verdad.
    porque_no: >-
      Con un solo escritor, el conflicto que la técnica evita no puede
      producirse: aquí se estudia, no se sufre.
    doc: https://duckdb.org/docs/stable/sql/statements/update.html

  - id: postgresql
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/postgresql/consulta.sql
    porque_si: >-
      Ofrece las dos estrategias y permite elegir con criterio: optimista con
      columna de versión cuando el conflicto es raro, o pesimista con `SELECT
      ... FOR UPDATE` cuando es frecuente y esperar sale más barato que
      reintentar. Y con `xmin` se puede hacer lo primero sin añadir columna.
    porque_no: >-
      `FOR UPDATE` retiene el bloqueo hasta el final de la transacción: si esa
      transacción espera a que una persona rellene un formulario, el bloqueo dura
      lo que dure el café. El bloqueo pesimista es incompatible con la
      interacción humana.
    doc: https://www.postgresql.org/docs/current/explicit-locking.html

  - id: mysql
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/mysql/consulta.sql
    porque_si: >-
      La misma técnica funciona igual, y `ROW_COUNT()` devuelve las filas
      afectadas para detectar el conflicto.
    porque_no: >-
      Cuidado con `ROW_COUNT()`: por omisión, el cliente cuenta las filas
      **cambiadas**, no las coincidentes, así que un `UPDATE` que escribe el
      mismo valor devuelve 0 y parece un conflicto que no existe. Depende de la
      bandera `CLIENT_FOUND_ROWS` del conector.
    doc: https://dev.mysql.com/doc/refman/8.4/en/information-functions.html

  - id: mongodb
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/mongodb/consulta.js
    porque_si: >-
      `updateOne` con el filtro sobre la versión es atómico sobre el documento y
      devuelve `matchedCount`, así que el conflicto se detecta en la misma
      llamada. Es el patrón recomendado para actualizaciones sin transacción.
    porque_no: >-
      La versión hay que mantenerla a mano en cada escritura: si un solo camino
      de código olvida incrementarla, la protección desaparece para todos sin que
      nada avise.
    doc: https://www.mongodb.com/docs/manual/reference/method/db.collection.updateOne/

  - id: redis
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/redis/consulta.txt
    porque_si: >-
      Tiene las dos formas: `WATCH` con `MULTI`/`EXEC`, que aborta si la clave
      cambió —bloqueo optimista integrado en el protocolo—, y el script Lua, que
      comprueba y escribe sin que nada se cuele en medio.
    porque_no: >-
      `WATCH` obliga a rehacer el ciclo entero en el cliente cuando falla, y con
      mucha contención la aplicación se pasa la vida reintentando. El script Lua
      lo evita, pero mete lógica de negocio dentro del almacén, donde no se
      versiona ni se prueba con el resto del código.
    doc: https://redis.io/docs/latest/develop/interact/transactions/

  - id: cassandra
    aplica: si
    ejecucion: declarado
    archivo: implementaciones/cassandra/consulta.cql
    porque_si: >-
      Las transacciones ligeras (`IF version = 1`) hacen exactamente esto, con
      acuerdo entre réplicas mediante Paxos, y devuelven `[applied]` para saber
      si ganó o perdió.
    porque_no: >-
      Cuestan cuatro rondas de red entre réplicas: del orden de veinte veces más
      que una escritura normal. Usarlas en el camino caliente es la forma más
      rápida de convertir un clúster de Cassandra en algo más lento que un solo
      PostgreSQL.
    doc: https://cassandra.apache.org/doc/latest/cassandra/developing/cql/dml.html

  - id: dynamodb
    aplica: no
    porque_no: >-
      Sí tiene el mecanismo —`ConditionExpression` sobre un atributo de
      versión—, pero no se puede mostrar aquí como código ejecutable ni
      comparable: es una llamada de API, no una sentencia.
    alternativa: >-
      `UpdateItem` con `ConditionExpression: version = :v` y
      `UpdateExpression: SET version = :v1`, que falla con
      `ConditionalCheckFailedException` cuando otro cliente se adelantó. Es el
      mismo patrón con otro vocabulario.
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Expressions.ConditionExpressions.html
