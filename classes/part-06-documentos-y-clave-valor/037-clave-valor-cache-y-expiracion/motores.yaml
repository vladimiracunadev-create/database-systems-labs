---
caso:
  titulo: Los tres estados de una clave con caducidad
  contrato: |
    Una caché no tiene dos estados sino tres, y confundirlos es la causa de casi
    todos los errores de caducidad: la clave **existe y caduca**, la clave
    **existe y no caduca**, o la clave **no está**. Redis los distingue en el
    valor que devuelve `TTL`: un número positivo, `-1` y `-2`.

    El caso guarda `k1` con caducidad, `k2` sin ella, no guarda `k3`, y pide el
    estado de las tres, ordenadas por clave. Lo revelador es lo que hay que
    escribir en los motores que **no** tienen caducidad: la columna de
    vencimiento, el filtro en cada lectura y el trabajo que borra lo vencido.
    Todo eso es lo que Redis regala y lo que se paga al no usarlo.
  columnas: [clave, estado]
  esperado:
    - [k1, expira]
    - [k2, permanente]
    - [k3, ausente]

motores:
  - id: redis
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/redis/consulta.txt
    porque_si: >-
      La caducidad es parte del almacén: se fija por clave, la aplica el
      servidor y `TTL` distingue los tres estados sin ambigüedad. La memoria se
      libera sola, con caducidad pasiva al leer y un muestreo activo de fondo.
    porque_no: >-
      La expiración es **aproximada**: entre el instante de vencimiento y el
      momento en que la memoria se libera pasa un tiempo indeterminado. Y si la
      memoria se agota antes, la política de desalojo puede borrar claves que
      todavía no habían vencido: una caché no es un almacén.
    doc: https://redis.io/docs/latest/commands/expire/

  - id: mongodb
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/mongodb/consulta.js
    porque_si: >-
      Un índice TTL sobre un campo de fecha borra los documentos vencidos sin
      que nadie lo pida, así que la colección puede hacer de caché duradera con
      la misma semántica de tres estados.
    porque_no: >-
      El proceso que borra corre **cada 60 segundos**: un documento vencido
      sigue siendo visible hasta un minuto después, así que la consulta tiene
      que filtrar por la fecha igualmente. El índice TTL libera espacio; no
      define visibilidad.
    doc: https://www.mongodb.com/docs/manual/core/index-ttl/

  - id: cassandra
    aplica: si
    ejecucion: declarado
    archivo: implementaciones/cassandra/consulta.cql
    porque_si: >-
      La caducidad se declara por **celda**, no por fila: `USING TTL` permite que
      un atributo caduque y el resto de la fila siga viva, algo que ningún otro
      motor de esta lista ofrece.
    porque_no: >-
      Cada celda vencida se convierte en una lápida que hay que recorrer en las
      lecturas hasta que la compactación la retire: usar TTL como mecanismo de
      cola de trabajo es uno de los antipatrones más conocidos de Cassandra.
    doc: https://cassandra.apache.org/doc/latest/cassandra/developing/cql/dml.html

  - id: sqlite
    aplica: si
    ejecucion: nucleo
    archivo: implementaciones/sqlite/consulta.sql
    porque_si: >-
      Enseña lo que cuesta no tener caducidad: una columna de vencimiento, un
      filtro en **cada** lectura y un borrado periódico. Escrito así, se ve que
      la caducidad no es magia, es trabajo que alguien tiene que hacer.
    porque_no: >-
      Ese trabajo hay que acordarse de hacerlo siempre: la consulta que olvide el
      filtro devolverá datos vencidos, y el borrado que nadie programe hará
      crecer la tabla para siempre.
    doc: https://sqlite.org/lang_datefunc.html

  - id: duckdb
    aplica: si
    ejecucion: nucleo
    archivo: implementaciones/duckdb/consulta.sql
    porque_si: >-
      Sirve para la pregunta de operación que nadie se hace a tiempo: cuántas
      claves hay vencidas, desde cuándo y cuánto espacio ocupan, sobre un
      volcado de la caché.
    porque_no: >-
      No es un almacén de claves ni tiene caducidad: aquí solo se analiza el
      estado de una caché que vive en otro sitio.
    doc: https://duckdb.org/docs/stable/sql/functions/date.html

  - id: postgresql
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/postgresql/consulta.sql
    porque_si: >-
      Con `timestamptz`, un índice sobre el vencimiento y un programador
      (`pg_cron`) para el borrado se consigue una caché duradera, transaccional
      y consultable: a veces es exactamente lo que hace falta y ahorra un
      sistema entero.
    porque_no: >-
      Cada lectura se convierte en una consulta al motor transaccional, con su
      conexión y su latencia: si la caché existía para descargar a PostgreSQL,
      ponerla dentro de PostgreSQL no descarga nada. Y ni siquiera se puede
      indexar «lo vigente»: un índice parcial con `now()` se rechaza, porque el
      predicado de un índice tiene que ser inmutable.
    doc: https://www.postgresql.org/docs/current/indexes-partial.html

  - id: dynamodb
    aplica: no
    porque_no: >-
      Tiene caducidad por elemento, pero su documentación advierte de que el
      borrado puede tardar **hasta 48 horas** en aplicarse: no sirve para
      distinguir los tres estados en el momento de la lectura.
    alternativa: >-
      Guardar la marca de vencimiento como atributo y filtrarla en cada lectura,
      usando el TTL solo como mecanismo de limpieza de espacio, nunca como
      control de visibilidad.
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TTL.html
