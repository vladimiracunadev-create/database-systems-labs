---
caso:
  titulo: >-
    Renunciar a encontrar siempre el vecino más cercano, y saber exactamente
    cuánto se renuncia
  modo: conceptual
  contrato: |
    La búsqueda exacta del vecino más cercano en muchas dimensiones no tiene
    atajo: hay que comparar contra todos. Por eso los índices vectoriales son
    **aproximados**: renuncian a garantizar el resultado correcto a cambio de
    ser miles de veces más rápidos.

    Esa renuncia se mide, y tiene nombre: **recall@k**, la fracción de los k
    vecinos verdaderos que el índice devolvió. Un índice con recall 0,95
    devuelve, de media, 19 de cada 20 correctos. Y aquí está lo importante: el
    recall **no se puede saber sin medirlo** contra una búsqueda exacta sobre el
    mismo conjunto.

    Los tres compromisos son siempre los mismos —velocidad, memoria y recall— y
    cada familia de índice los reparte distinto. Esta comparación enumera qué
    ofrece cada motor y **qué parámetro mueve cada eje**, porque elegirlos a ojo
    es lo habitual y es un error.
  columnas: []
  esperado: []

motores:
  - id: qdrant
    aplica: si
    como: >-
      HNSW con parámetros explícitos: `m` (conexiones por nodo, memoria y
      calidad), `ef_construct` (esfuerzo al construir) y `ef` en cada consulta
      (esfuerzo al buscar). Añade cuantización escalar, binaria y por producto
      para reducir memoria, y permite guardar el original en disco y reordenar
      los candidatos con él.
    porque_si: >-
      El compromiso se ajusta **por consulta** con `ef`, sin reconstruir nada:
      la misma colección puede servir una búsqueda rápida y otra exhaustiva.
    porque_no: >-
      HNSW es un grafo en memoria: su tamaño crece con `m` y con el número de
      vectores, y no se puede reducir sin perder recall. La cuantización lo
      alivia y **baja el recall**; medir cuánto es obligatorio, no opcional.
    doc: https://qdrant.tech/documentation/concepts/indexing/

  - id: milvus
    aplica: si
    como: >-
      Ofrece la mayor variedad de familias: **IVF** —agrupa en celdas y busca
      solo en `nprobe` de ellas—, **HNSW**, **DiskANN** para conjuntos que no
      caben en memoria, y variantes cuantizadas de cada una.
    porque_si: >-
      Poder elegir familia permite ajustarse al presupuesto real: IVF con
      cuantización por producto cabe en una fracción de la memoria que pide HNSW,
      a cambio de recall.
    porque_no: >-
      IVF tiene un fallo propio que sorprende: si el vecino verdadero cayó en una
      celda que `nprobe` no visitó, **no aparece nunca**, por mucho que se suba
      el límite de resultados. Y construir el índice exige entrenar con una
      muestra representativa.
    doc: https://milvus.io/docs/index.md

  - id: postgresql
    aplica: si
    como: >-
      Con pgvector, dos índices: **HNSW** —mejor recall, construcción lenta, más
      memoria— e **IVFFlat** —construcción rápida, menos memoria, hay que
      elegir el número de listas y **reconstruirlo** cuando los datos crecen—.
      El esfuerzo de búsqueda se ajusta con `hnsw.ef_search` o `ivfflat.probes`.
    porque_si: >-
      El índice vive junto a los datos: se puede combinar con `WHERE` sobre
      columnas normales y todo ocurre en una transacción. Para la mayoría de los
      sistemas, eso vale más que unos puntos de recall.
    porque_no: >-
      El filtrado y el índice conviven mal: si el `WHERE` es muy selectivo,
      PostgreSQL puede recorrer el índice vectorial y descartar casi todo
      después, devolviendo menos resultados de los pedidos. Es el mismo problema
      del filtrado que Qdrant resuelve dentro del grafo.
    doc: https://www.postgresql.org/docs/current/indexes-types.html

  - id: opensearch
    aplica: si
    como: >-
      Índice `knn_vector` con HNSW sobre las bibliotecas Lucene, nmslib o FAISS,
      con `ef_search` y `m` configurables, y búsqueda exacta disponible para
      medir el recall contra ella.
    porque_si: >-
      Que la búsqueda exacta esté a mano en el mismo sistema hace fácil lo que
      casi nadie hace: **medir** el recall real en vez de suponerlo.
    porque_no: >-
      El índice vectorial se suma al invertido en la misma memoria del clúster,
      y competir por ella degrada las dos búsquedas a la vez. Dimensionar deja de
      ser un problema de una sola estructura.
    doc: https://docs.opensearch.org/latest/vector-search/

  - id: duckdb
    aplica: si
    como: >-
      Fuerza bruta vectorizada, y una extensión HNSW experimental. Su papel aquí
      no es servir búsquedas: es **calcular la verdad** contra la que se mide el
      recall de los demás.
    porque_si: >-
      Sin una lista de vecinos verdaderos, la palabra «recall» no significa
      nada. Calcularla por fuerza bruta sobre una muestra es exactamente el
      trabajo para el que sirve.
    porque_no: >-
      Ese cálculo es caro por definición: sirve para una muestra de consultas de
      evaluación, no para el tráfico real.
    doc: https://duckdb.org/docs/stable/extensions/vss

  - id: sqlite
    aplica: no
    porque_no: >-
      No hay índice vectorial en el motor: solo fuerza bruta escrita a mano, que
      es lo que la clase anterior ya mostró. Aquí no aportaría una fila distinta.
    alternativa: >-
      Extensiones de terceros construidas sobre SQLite para búsqueda vectorial en
      el dispositivo, con las mismas familias de índice y los mismos
      compromisos.
    doc: https://sqlite.org/lang_expr.html

  - id: redis
    aplica: no
    porque_no: >-
      Su índice vectorial vive en el módulo de búsqueda, no en el servidor base:
      compararlo aquí exigiría una imagen distinta de la que este repositorio
      levanta.
    alternativa: >-
      Con el módulo, HNSW o fuerza bruta sobre campos de hash o JSON; sin él,
      Redis como caché de los resultados que devuelve otro sistema.
    doc: https://redis.io/docs/latest/develop/interact/search-and-query/advanced-concepts/vectors/
