---
caso:
  titulo: Todos los prerrequisitos de un curso, por lejos que estén en la cadena
  contrato: |
    AR-301 exige SE-201, que exige DB-101, que exige MA-100. La pregunta —«¿qué
    tengo que haber aprobado antes de AR-301?»— tiene una propiedad que la hace
    distinta de todas las anteriores: **no se sabe de antemano cuántas reuniones
    hacen falta**. Hoy la cadena tiene tres eslabones; mañana, siete.

    Todo motor relacional serio la resuelve con `WITH RECURSIVE`, y funciona. Lo
    que esta clase compara es el precio: en SQL hay que escribir el caso base, el
    paso recursivo y la protección contra ciclos cada vez; en un grafo, el
    recorrido de profundidad variable es un símbolo del lenguaje.
  columnas: [curso]
  esperado:
    - [DB-101]
    - [MA-100]
    - [SE-201]

motores:
  - id: neo4j
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/neo4j/consulta.cypher
    porque_si: >-
      El recorrido de profundidad variable se escribe con dos caracteres:
      `-[:REQUIERE*]->`. Y el costo no depende del tamaño del grafo sino del
      vecindario recorrido, porque cada nodo guarda punteros a sus vecinos en
      vez de resolverse por índice en cada salto.
    porque_no: >-
      Ese mismo modelo penaliza lo tabular: contar todos los nodos de una
      etiqueta o agregar sobre todos ellos es más caro que en una tabla, y
      mantener un grafo entero para una jerarquía de tres niveles es añadir un
      sistema para no escribir seis líneas de SQL.
    doc: https://neo4j.com/docs/cypher-manual/current/patterns/variable-length-patterns/

  - id: postgresql
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/postgresql/consulta.sql
    porque_si: >-
      `WITH RECURSIVE` es del estándar y resuelve el caso sin salir del motor
      donde ya están los datos: para jerarquías de pocos niveles —organigramas,
      categorías, listas de materiales— es casi siempre la respuesta correcta.
    porque_no: >-
      Cada nivel de profundidad es una reunión más, y el planificador estima muy
      mal el número de filas de una recursión: a partir de cierta profundidad,
      el plan deja de tener sentido y el tiempo se dispara sin aviso.
    doc: https://www.postgresql.org/docs/current/queries-with.html

  - id: sqlite
    aplica: si
    ejecucion: nucleo
    archivo: implementaciones/sqlite/consulta.sql
    porque_si: >-
      Implementa `WITH RECURSIVE` completo, así que el recorrido en anchura se
      puede estudiar sin instalar nada. `UNION` en vez de `UNION ALL` es lo que
      corta los ciclos: descarta las filas ya vistas.
    porque_no: >-
      Solo tiene bucle anidado como algoritmo de reunión, así que cada nivel
      vuelve a buscar por índice fila a fila: la recursión funciona y no escala.
    doc: https://sqlite.org/lang_with.html

  - id: duckdb
    aplica: si
    ejecucion: nucleo
    archivo: implementaciones/duckdb/consulta.sql
    porque_si: >-
      Admite la misma sintaxis recursiva y la resuelve de forma vectorizada, lo
      que la hace viable sobre grafos grandes exportados a Parquet: es la vía
      analítica para responder «cuántos caminos hay» sin montar un grafo.
    porque_no: >-
      No hay recorrido guiado ni algoritmos de grafo: para camino más corto,
      centralidad o comunidades hay que escribirlo todo a mano, si es que se
      puede.
    doc: https://duckdb.org/docs/stable/sql/query_syntax/with.html

  - id: mongodb
    aplica: si
    ejecucion: servicio
    archivo: implementaciones/mongodb/consulta.js
    porque_si: >-
      `$graphLookup` hace el recorrido transitivo dentro del motor, con
      profundidad máxima configurable: no hace falta traerse el grafo al cliente
      ni escribir la recursión.
    porque_no: >-
      Está limitado a 100 MB de memoria por operación y no puede usar índice
      para la búsqueda recursiva en colecciones fragmentadas: es una herramienta
      para jerarquías modestas, no para un grafo de verdad.
    doc: https://www.mongodb.com/docs/manual/reference/operator/aggregation/graphLookup/

  - id: cassandra
    aplica: no
    porque_no: >-
      No hay reuniones, no hay recursión y no hay forma de recorrer una relación
      sin conocer de antemano cuántos saltos harán falta. Cada salto sería una
      consulta desde el cliente, con su latencia de red.
    alternativa: >-
      Guardar el cierre transitivo ya calculado —una fila por cada par
      (curso, prerrequisito lejano)— y recalcularlo cuando cambie el plan de
      estudios: se paga en escritura y en espacio lo que no se puede pagar en
      lectura.
    doc: https://cassandra.apache.org/doc/latest/cassandra/developing/data-modeling/intro.html

  - id: redis
    aplica: no
    porque_no: >-
      Recorrer exigiría un viaje por salto o un script Lua que implemente la
      búsqueda en anchura a mano: el almacén no entiende la relación, solo
      entiende claves.
    alternativa: >-
      Guardar en un conjunto los prerrequisitos transitivos de cada curso
      (`curso:AR-301:requiere-todo`) y reconstruirlo al cambiar el grafo.
    doc: https://redis.io/docs/latest/develop/data-types/sets/
