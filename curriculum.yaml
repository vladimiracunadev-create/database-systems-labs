---
# Fuente unica de verdad del programa.
#
# De este archivo salen: el indice de `classes/`, el README raiz, el sitio de
# GitHub Pages y las comprobaciones de CI. Editar una clase aqui y no crear su
# `lesson.md` (o al reves) hace fallar `scripts/validate_repository.py`.
#
# Regla no negociable del repositorio: `sources` no puede estar vacio en
# ninguna clase, y cada id debe existir en `catalog/sources.json`.

programa:
  nombre: Database Systems Labs
  version: 2.0.0
  idioma: es
  repositorio: https://github.com/vladimiracunadev-create/database-systems-labs
  sitio: https://vladimiracunadev-create.github.io/database-systems-labs/
  licencia: MIT
  actualizado: 2026-08-19
  resumen: >-
    Programa de ingeniería de datos y bases de datos que va del modelado
    conceptual a la arquitectura distribuida, la operación y los sistemas de
    recuperación para inteligencia artificial. Cada clase declara de qué libro,
    artículo, norma o documentación oficial procede lo que afirma.

evaluacion:
  diagnostico: 0
  evidencias_de_laboratorio: 40
  retos_de_transferencia: 20
  decisiones_de_arquitectura: 15
  proyecto_final: 25
  aprobacion: 80
  nota: >-
    Un resultado correcto sin explicación no demuestra transferencia. La
    aprobación exige ademas evidencia de restauración probada, control de
    acceso y pruebas.

  # Escala común de la rúbrica. Cuatro niveles, y el 3 es el listón de lo
  # aceptable en un sistema real: por debajo, el trabajo no se puede defender.
  escala:
    1: Inicial
    2: Funcional
    3: Sólido
    4: Profesional

  # Rúbrica analítica del proyecto final. Cada dimensión describe sus cuatro
  # niveles para que dos correctores lleguen al mismo número sin hablar entre
  # ellos, y declara qué evidencia del repositorio la sostiene.
  dimensiones:
    - id: requisitos
      nombre: Requisitos e invariantes
      peso: 10
      minimo: 2
      pregunta: ¿Se sabe qué tiene que ser siempre verdad en este sistema?
      evidencia: Lista de invariantes con la prueba que los comprueba.
      niveles:
        1: Requisitos narrados, sin invariantes explícitos.
        2: Invariantes declarados, pero ninguno comprobado por código.
        3: Invariantes declarados, priorizados y comprobados al menos por una prueba.
        4: Invariantes medibles y trazables hasta la consulta o restricción que los sostiene.
      clases: ["005", "013"]

    - id: modelado
      nombre: Modelado
      peso: 12
      minimo: 3
      pregunta: ¿El modelo responde a los patrones de acceso declarados?
      evidencia: Modelo conceptual, lógico y físico, con los patrones de acceso al lado.
      niveles:
        1: Tablas dibujadas sin patrones de acceso.
        2: Modelo correcto pero desconectado de las consultas que tendrá que servir.
        3: Modelo coherente con los accesos, con normalización justificada.
        4: Coherente en los tres niveles, con la desnormalización deliberada y su costo declarado.
      clases: ["006", "008", "009"]

    - id: consultas
      nombre: Consultas y contratos
      peso: 8
      minimo: 3
      pregunta: ¿Las consultas son correctas también en los límites?
      evidencia: Consultas con sus casos de borde probados (nulos, vacíos, duplicados).
      niveles:
        1: Consultas que funcionan con el caso feliz.
        2: Consultas correctas, sin parametrizar o sin probar límites.
        3: Consultas parametrizadas y probadas con nulos, vacíos y duplicados.
        4: Además, contrato de esquema versionado y probado ante cambios.
      clases: ["014", "016", "019", "051"]

    - id: transacciones
      nombre: Transacciones y concurrencia
      peso: 10
      minimo: 3
      pregunta: ¿Qué pasa cuando dos procesos hacen lo mismo a la vez?
      evidencia: Una anomalía reproducida y su corrección, con la traza de ambas.
      niveles:
        1: Se menciona que hay transacciones.
        2: Se usan transacciones sin declarar nivel de aislamiento ni anomalías.
        3: Una anomalía reproducida y corregida, con el mecanismo explicado.
        4: Anomalías reproducidas, corregidas y protegidas por una prueba automática.
      laboratorios: ["03"]
      clases: ["034", "037"]

    - id: rendimiento
      nombre: Rendimiento y planes
      peso: 10
      minimo: 2
      pregunta: ¿La conclusión de rendimiento se puede repetir?
      evidencia: Plan de ejecución antes y después, con protocolo y límites declarados.
      niveles:
        1: Afirmaciones de rendimiento sin medición.
        2: Medición sin protocolo ni repeticiones.
        3: Protocolo reproducible, plan de ejecución leído y conclusión acotada a la carga.
        4: Además, costo de escritura del índice medido y decisión justificada con números.
      laboratorios: ["04"]
      clases: ["042"]

    - id: distribucion
      nombre: Distribución y consistencia
      peso: 8
      minimo: 2
      pregunta: ¿Qué garantía pierde el usuario cuando algo falla?
      evidencia: Modelo de consistencia declarado y una lectura obsoleta observada.
      niveles:
        1: Se dice "eventualmente consistente" sin definir nada.
        2: Se declara el modelo de consistencia, sin observar su efecto.
        3: Se observa el efecto de la réplica en una lectura y se declara la garantía de sesión.
        4: Además, se mide el retraso y se elige la corrección con su costo.
      laboratorios: ["07"]
      clases: ["045", "046"]

    - id: seguridad
      nombre: Seguridad y privacidad
      peso: 12
      minimo: 3
      pregunta: ¿Quién accede a qué, y qué pasa con el dato personal?
      evidencia: Roles con privilegio mínimo probados y política de retención implementada.
      niveles:
        1: Un usuario administrador para todo.
        2: Roles separados, sin prueba de que restringen.
        3: Privilegio mínimo demostrado con una consulta que falla como debe, y datos sintéticos.
        4: Además, retención implementada, minimización declarada y secretos fuera del repositorio.
      clases: ["050", "051", "053"]

    - id: recuperacion
      nombre: Respaldo y recuperación
      peso: 12
      minimo: 3
      pregunta: ¿Cuánto dato se puede perder y cuánto cuesta volver?
      evidencia: Una restauración ejecutada, cronometrada y verificada contra el original.
      niveles:
        1: Existe un respaldo.
        2: El respaldo se automatiza, pero nunca se ha restaurado.
        3: Restauración ejecutada y verificada, con RPO y RTO declarados.
        4: Además, restauración a un punto en el tiempo y prueba de que el archivo está íntegro.
      laboratorios: ["08"]
      clases: ["048", "036"]

    - id: operacion
      nombre: Operación y observabilidad
      peso: 8
      minimo: 2
      pregunta: ¿Cómo se sabe que el sistema está sano antes de que alguien se queje?
      evidencia: Objetivo de servicio, métricas que lo vigilan y un runbook.
      niveles:
        1: No hay métricas.
        2: Métricas del sistema sin objetivo declarado.
        3: Objetivo de servicio con las métricas que lo miden y una alerta accionable.
        4: Además, capacidad proyectada y runbook probado por otra persona.
      clases: ["052"]

    - id: decisiones
      nombre: Decisiones y comunicación
      peso: 10
      minimo: 3
      pregunta: ¿Puede otra persona revisar la decisión dentro de dos años?
      evidencia: ADR con contexto, alternativas, consecuencias y criterio de revisión.
      niveles:
        1: La decisión está en la cabeza de quien la tomó.
        2: Decisión documentada sin alternativas ni consecuencias.
        3: ADR completo, con alternativas descartadas y su porqué.
        4: Además, costo total estimado, criterio de revisión y plan de vuelta atrás.
      clases: ["063", "064"]

  # Lo que suspende sin importar la nota: no son errores, son incumplimientos
  # del contrato del programa.
  faltas_criticas:
    - Datos personales reales sin autorización, en cualquier parte de la entrega.
    - Credenciales, tokens o cadenas de conexión en el repositorio.
    - Medición de rendimiento inventada o imposible de repetir.
    - Respaldo que nunca se restauró.
    - Pérdida de un invariante en el caso concurrente obligatorio.
    - "Conclusión que el trabajo no sostiene: afirmar más de lo que se midió."

  # El examen final de cada ruta. Misma estructura para las siete; cambia el
  # contenido, que sale de las partes y los laboratorios de la propia ruta.
  examen:
    bloques:
      - id: teoria
        nombre: Teoría
        puntos: 25
        formato: >-
          Responder por escrito seis preguntas del banco de autoevaluación,
          elegidas entre las partes de la ruta. Se corrige con la dimensión de
          decisiones y comunicación: explicar el mecanismo, no repetir la
          definición.
      - id: practica
        nombre: Práctica
        puntos: 50
        minimo: 30
        formato: >-
          Ejecutar los laboratorios de la ruta, extender uno de ellos con un
          caso propio y entregar la evidencia: comando, salida completa,
          entorno y explicación de por qué el resultado es el que es.
      - id: informe
        nombre: Informe y defensa
        puntos: 25
        formato: >-
          Un documento breve —decisión, evidencia y límites— defendido en
          quince minutos ante alguien que pregunte. Se corrige con la rúbrica
          del proyecto final.
    aprobacion: 70

# Rutas por rol. Cada una declara su recorrido por partes, las clases que no
# se pueden saltar, los laboratorios que la sostienen, los cargos a los que
# apunta y las fuentes de las que salen sus afirmaciones de oficio y de
# mercado. La guia larga vive en `rutas/<clave>.md`; aqui solo los datos.
rutas:
  desarrollo-de-aplicaciones:
    titulo: Desarrollador de aplicaciones
    descripcion: Modelar bien, consultar con seguridad y no romper producción.
    nivel: entrada
    foco: >-
      La base de datos vista desde el código que la usa: esquema como contrato,
      consultas correctas, concurrencia y despliegues sin caída.
    partes: ["00", "01", "02", "03", "04", "05", "07", "08", "10", "13"]
    clases_clave: ["007", "014", "016", "019", "037", "049", "051"]
    laboratorios: ["01", "03", "04"]
    cargos: [Desarrollador backend, Desarrollador full-stack, Ingeniero de software]
    guia: rutas/desarrollo-de-aplicaciones.md
    fuentes: [karwin-sql-antipatterns, date-sql-relational-theory, owasp-sqli-cheatsheet, so-developer-survey-2025]

  ingenieria-de-datos:
    titulo: Ingeniero de datos
    descripcion: Mover datos entre sistemas conservando trazabilidad y semántica.
    nivel: intermedio
    foco: >-
      Tuberías que otros usan para decidir: integración, captura de cambios,
      modelado analítico y streaming con semántica declarada.
    partes: ["00", "01", "02", "03", "06", "09", "11", "12", "13"]
    clases_clave: ["030", "032", "054", "055", "056", "057"]
    laboratorios: ["01", "02", "05"]
    cargos: [Ingeniero de datos, Ingeniero de plataforma de datos, Ingeniero de streaming]
    guia: rutas/ingenieria-de-datos.md
    fuentes: [reis-housley-data-engineering, kimball-toolkit, streaming-systems, cert-google-data-engineer]

  fiabilidad-y-operacion:
    titulo: DBA / SRE de datos
    descripcion: Sostener disponibilidad, rendimiento y recuperación demostrada.
    nivel: intermedio
    foco: >-
      Que el sistema siga en pie y se pueda volver atrás: respaldo restaurado,
      planes de ejecución, réplica, objetivos de servicio y migraciones.
    partes: ["00", "01", "03", "04", "07", "08", "09", "10", "13"]
    clases_clave: ["036", "038", "042", "048", "049", "052"]
    laboratorios: ["01", "03", "04"]
    cargos: [Administrador de bases de datos, SRE de datos, Ingeniero de fiabilidad]
    guia: rutas/fiabilidad-y-operacion.md
    fuentes: [campbell-majors-dbre, google-sre-book, bls-ooh-dba, cert-microsoft-dp300]

  arquitectura:
    titulo: Arquitecto de datos
    descripcion: Elegir por evidencia y defender el costo de la decisión.
    nivel: avanzado
    foco: >-
      Decidir qué motor, qué modelo y qué garantías, con la medición y el
      registro de decisión que permiten defenderlo y revertirlo.
    partes: ["00", "01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13"]
    clases_clave: ["045", "046", "047", "062", "063", "064"]
    laboratorios: ["02", "04", "06"]
    cargos: [Arquitecto de datos, Arquitecto de soluciones, Ingeniero de staff]
    guia: rutas/arquitectura.md
    fuentes: [kleppmann-ddia, redbook5, helland-life-beyond-2007, db-engines-ranking]

  analitica-y-bi:
    titulo: Analytics engineer / BI
    descripcion: Convertir datos crudos en modelos que una organización pueda consultar sin equivocarse.
    nivel: intermedio
    foco: >-
      SQL analítico serio, modelado dimensional, transformaciones versionadas y
      la frontera entre la carga transaccional y la analítica.
    partes: ["00", "01", "02", "03", "04", "08", "11", "13"]
    clases_clave: ["017", "018", "032", "054", "055", "056"]
    laboratorios: ["01", "04"]
    cargos: [Analytics engineer, Ingeniero de BI, Analista de datos sénior]
    guia: rutas/analitica-y-bi.md
    fuentes: [kimball-toolkit, docs-dbt, docs-duckdb, so-developer-survey-2025]

  ia-y-recuperacion:
    titulo: Ingeniero de IA aplicada y recuperación
    descripcion: Construir recuperación medible antes de dejar que un modelo hable.
    nivel: avanzado
    foco: >-
      Embeddings, índices aproximados, búsqueda híbrida y evaluación de la
      recuperación: la parte del RAG que decide si la respuesta es defendible.
    partes: ["00", "01", "02", "03", "05", "06", "08", "12", "13"]
    clases_clave: ["031", "041", "058", "059", "060", "061"]
    laboratorios: ["01", "05", "06"]
    cargos: [Ingeniero de IA aplicada, Ingeniero de búsqueda y recuperación, ML engineer de producto]
    guia: rutas/ia-y-recuperacion.md
    fuentes: [lewis-rag-2020, malkov-hnsw-2018, robertson-bm25-2009, docs-pgvector]

  gobierno-y-privacidad:
    titulo: Gobierno y privacidad del dato
    descripcion: Responder quién accede a qué, con qué base legal y hasta cuándo se conserva.
    nivel: intermedio
    foco: >-
      Control de acceso, minimización, retención, trazabilidad y la evidencia
      que exige una auditoría o un regulador.
    partes: ["00", "01", "03", "07", "09", "10", "11", "13"]
    clases_clave: ["013", "048", "050", "051", "053", "063"]
    laboratorios: ["01", "03"]
    cargos: [Responsable de gobierno del dato, Especialista en cumplimiento de datos, Delegado de protección de datos técnico]
    guia: rutas/gobierno-y-privacidad.md
    fuentes: [gdpr-2016-679, chile-ley-19628, nist-sp800-53, cert-dama-cdmp]

# Los laboratorios, con lo que cada uno demuestra y de donde procede el
# criterio. `comando` vacio significa que el laboratorio es de diseno y se
# entrega escrito, no ejecutado. Los ejecutables corren en integracion continua.
# El texto de este bloque se publica tal cual en el sitio: va acentuado.
laboratorios:
  - id: "01"
    titulo: Fundamentos de SQL sobre el dominio educativo
    ruta: labs/01-sql-foundations
    comando: python labs/01-sql-foundations/run_lab.py
    marca: LAB_OK
    duracion: 90
    resumen: >-
      Carga el esquema y los datos canónicos en SQLite en memoria, ejecuta
      reuniones y agregaciones, y comprueba invariantes sobre el resultado.
    mide:
      - filas devueltas por cada consulta frente a las esperadas
      - integridad referencial del conjunto de datos
    fuentes: [docs-sqlite, docs-python-sqlite3, iso-9075]

  - id: "02"
    titulo: Modelado políglota del mismo dominio
    ruta: labs/02-polyglot-modeling
    comando: ""
    marca: ""
    duracion: 120
    resumen: >-
      Traduce el mismo dominio a tres modelos —relacional, documental y de
      grafo— y obliga a declarar qué gana y qué se pierde en cada uno.
    mide:
      - consultas que cada modelo resuelve sin trabajo adicional
      - duplicación y riesgo de divergencia que introduce cada modelo
    fuentes: [sadalage-fowler-nosql, docs-mongodb-modeling, docs-neo4j, graph-databases-2ed]

  - id: "03"
    titulo: Actualización perdida y sus tres correcciones
    ruta: labs/03-transactions
    comando: python labs/03-transactions/run_transactions_lab.py
    marca: TRANSACTIONS_LAB_OK
    duracion: 90
    resumen: >-
      Dos hilos reales compiten por la última plaza de un curso. El laboratorio
      reproduce la actualización perdida y la corrige con actualización
      atómica, control optimista por versión y bloqueo pesimista.
    mide:
      - reservas aceptadas frente a plazas existentes
      - conflictos detectados por el control optimista
    fuentes: [berenson-isolation-1995, gray-reuter-tp, docs-sqlite-isolation, docs-postgresql-mvcc, kleppmann-hermitage]

  - id: "04"
    titulo: Planes de ejecución y costo real de un índice
    ruta: labs/04-indexing
    comando: python labs/04-indexing/run_indexing_lab.py
    marca: INDEXING_LAB_OK
    duracion: 90
    resumen: >-
      Veinte mil filas deterministas, tres consultas y dos índices. Las
      aserciones son sobre el plan y sobre el trabajo —instrucciones de la
      máquina virtual—, nunca sobre el tiempo.
    mide:
      - forma del plan antes y después de cada índice
      - trabajo de la consulta y costo en páginas de la escritura
    fuentes: [winand-sql-performance, docs-sqlite-optoverview, docs-postgresql-explain, bayer-mccreight-1972]

  - id: "05"
    titulo: Elección por carga de trabajo en almacenes no relacionales
    ruta: labs/05-nosql-workloads
    comando: python labs/05-nosql-workloads/run_nosql_lab.py
    marca: NOSQL_LAB_OK
    duracion: 90
    resumen: >-
      Cuenta accesos, bytes y tamaño de partición para decidir entre incrustar
      y referenciar, y para mostrar que un TTL no es coherencia ni una clave de
      partición cualquiera reparte la carga.
    mide:
      - lecturas obsoletas con y sin invalidación en la escritura
      - accesos y bytes reescritos de cada modelo bajo la misma carga
      - tamaño de la partición mayor según la clave elegida
    fuentes: [docs-mongodb-modeling, docs-redis, docs-cassandra, sadalage-fowler-nosql, decandia-dynamo-2007]

  - id: "06"
    titulo: Recuperación vectorial explicable
    ruta: labs/06-vector-search
    comando: python labs/06-vector-search/run_vector_lab.py
    marca: VECTOR_LAB_OK
    duracion: 60
    resumen: >-
      Similitud coseno y recall@k sobre vectores deterministas, antes de
      introducir cualquier modelo de embeddings externo.
    mide:
      - orden del ranking frente al esperado
      - recall@k sobre el conjunto relevante declarado
    fuentes: [malkov-hnsw-2018, karpukhin-dpr-2020, robertson-bm25-2009, docs-qdrant]

  - id: "07"
    titulo: Réplica, retraso y garantías de sesión
    ruta: labs/07-replication
    comando: python labs/07-replication/run_replication_lab.py
    marca: REPLICATION_LAB_OK
    duracion: 90
    resumen: >-
      Un líder y dos seguidores con retraso declarado. Cuenta las lecturas
      obsoletas y las que rompen garantías que la aplicación daba por hechas, y
      aplica las tres correcciones: leer del líder, esperar la posición propia o
      exigir quórum.
    mide:
      - lecturas que no ven la escritura propia del cliente
      - lecturas no monótonas al repartir entre réplicas con distinto retraso
      - espera que cuesta cada garantía y cola pendiente del seguidor más lento
    fuentes: [gray-danger-replication-1996, bailis-hat-2013, vogels-eventually-consistent-2009, docs-postgresql]

  - id: "08"
    titulo: Respaldo, restauración y punto en el tiempo
    ruta: labs/08-recovery
    comando: python labs/08-recovery/run_recovery_lab.py
    marca: RECOVERY_LAB_OK
    duracion: 90
    resumen: >-
      Respalda una base real con la API del motor, sigue escribiendo mientras
      archiva cada transacción, provoca un borrado sin filtro y reconstruye la
      base a un instante anterior al desastre. Un respaldo que no se restaura no
      es un respaldo.
    mide:
      - transacciones perdidas (RPO) con cada estrategia de recuperación
      - trabajo de recuperación en operaciones reproducidas
      - igualdad exacta entre la base restaurada y el estado bueno

    fuentes: [mohan-aries-1992, docs-postgresql-backup, docs-sqlite-wal, campbell-majors-dbre]

parts:
  - id: "00"
    slug: fundamentos-datos-sistemas-y-metodo
    title: Fundamentos, sistemas y método
    summary: >-
      Qué problema resuelve un gestor de bases de datos, qué hay dentro de él y
      cómo se monta un entorno donde cada afirmación pueda comprobarse.
    classes:
      - id: "001"
        slug: que-resuelve-un-sistema-de-bases-de-datos
        title: Qué resuelve un sistema de bases de datos y qué no
        hours: 3
        level: fundamentos
        concepts: [persistencia, concurrencia, integridad, recuperación, independencia de datos]
        engines: [sqlite]
        lab: labs/01-sql-foundations
        sources: [silberschatz-dsc7, hellerstein-architecture, kent-data-and-reality, codd-1970]
      - id: "002"
        slug: arquitectura-interna-de-un-gestor
        title: Arquitectura interna de un gestor, del cliente al disco
        hours: 3
        level: fundamentos
        concepts: [analizador, planificador, ejecutor, gestor de almacenamiento, buffer pool]
        engines: [postgresql, sqlite]
        lab: labs/01-sql-foundations
        sources: [hellerstein-architecture, petrov-database-internals, rogov-postgresql-internals]
      - id: "003"
        slug: independencia-de-datos-y-niveles-de-esquema
        title: Independencia de datos y los tres niveles de esquema
        hours: 3
        level: fundamentos
        concepts: [esquema conceptual, esquema físico, vista externa, independencia lógica]
        engines: [postgresql, sqlite]
        lab: labs/01-sql-foundations
        sources: [codd-1970, silberschatz-dsc7, date-sql-relational-theory]
      - id: "004"
        slug: entorno-reproducible-y-evidencia
        title: Entorno reproducible y evidencia comprobable
        hours: 3
        level: fundamentos
        concepts: [reproducibilidad, semilla, contenedor, invariante, evidencia]
        engines: [sqlite, postgresql, mongodb]
        lab: labs/01-sql-foundations
        sources: [docs-sqlite, docs-python-sqlite3, docs-docker-compose, google-sre-book]

  - id: "01"
    slug: modelado-conceptual-y-requisitos
    title: Modelado conceptual y requisitos
    summary: >-
      Del enunciado ambiguo al esquema defendible: entidades, claves,
      dependencias funcionales y la decisión consciente de desnormalizar.
    classes:
