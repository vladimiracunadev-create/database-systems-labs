  - id: "14"
    slug: arquitectura-y-proyecto-final
    title: Arquitectura y proyecto final
    summary: >-
      Cerrar el programa con una decisión defendible: comparación por
      evidencia, costo total y una demostración que se pueda auditar.
    prerrequisitos: ["10", "11", "12", "13"]
    introduccion:
      - >-
          Tres clases para convertir catorce partes de conocimiento en una decisión que se
          pueda defender. No hay material nuevo de motores aquí: hay método, registro y
          defensa.
      - >-
          La primera clase pone la elección de motores en su forma técnica: carga de trabajo
          cuantificada, criterio de comparación escrito antes de mirar los productos, y la
          complejidad añadida contada como lo que cuesta —otro modelo de fallo, otro
          respaldo, otra guardia—. La segunda enseña a dejar constancia con registros de
          decisión de arquitectura, costo total de propiedad a varios años y reversibilidad
          como criterio para saber cuánto análisis merece cada decisión. La tercera es el
          proyecto final: diseñar, medir y defender ante preguntas hostiles, declarando los
          límites de lo que el trabajo demuestra.
      - >-
          El proyecto final se evalúa como una revisión de arquitectura real. La pregunta no
          es si funciona, sino qué mediste, qué alternativa descartaste y con qué dato.
    resultados:
      - >-
          Cuantificar una carga de trabajo y derivar de ella un criterio de selección
          escrito.
      - >-
          Comparar candidatos por evidencia reproducible y no por características
          anunciadas.
      - >-
          Escribir registros de decisión con contexto, alternativas y consecuencias
          negativas aceptadas.
      - >-
          Estimar el costo total de propiedad a tres años, incluidas las horas de operación.
      - >-
          Defender el diseño ante preguntas hostiles declarando explícitamente sus límites.
    errores:
      - >-
          «Elegimos X porque es el estándar de la industria.» Eso no es un criterio, es una
          apelación a la costumbre. El criterio es la carga de trabajo.
      - >-
          «Persistencia políglota es usar varios motores.» Es usar varios motores cuando
          cada uno está justificado, contando la complejidad añadida que eso cuesta.
      - >-
          «Comparé el precio por hora de cómputo.» Falta el costo mayor: las personas, las
          guardias, la formación y la migración de salida.
      - >-
          «Declarar límites debilita la defensa.» La refuerza: distingue lo que mediste de
          lo que esperas, y eso es exactamente lo que un revisor busca.
    classes:
      - id: "072"
        slug: persistencia-poliglota-por-evidencia
